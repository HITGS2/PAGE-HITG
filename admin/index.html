
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAGE:HITG | ADMIN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #171a30;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 40px;
      margin: 20px;
      background: #222640;
      border: 1px solid #353b5a;
      border-radius: 14px;
    }

    .logo {
      font-size: 12px;
      letter-spacing: 3px;
      color: #8de6c1;
      margin-bottom: 35px;
    }

    h1 {
      font-size: 26px;
      margin: 0 0 10px;
    }

    .description {
      font-size: 13px;
      color: #aeb6d2;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 8px;
      color: #cbd1e5;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      background: #171a30;
      border: 1px solid #414766;
      border-radius: 7px;
      color: #ffffff;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #8de6c1;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #8de6c1;
      border: none;
      border-radius: 7px;
      color: #171a30;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #a4f0d0;
    }

    .back-link {
      display: block;
      margin-top: 25px;
      text-align: center;
      color: #aeb6d2;
      text-decoration: none;
      font-size: 12px;
    }

    .back-link:hover {
      color: #8de6c1;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">PAGE:HITG / ADMIN</div>

    <h1>관리자 로그인</h1>

    <p class="description">
      관리자 계정으로 로그인해 주세요.
    </p>

    <form id="loginForm">

      <label for="email">이메일</label>
      <input
        type="email"
        id="email"
        placeholder="관리자 이메일"
        autocomplete="username"
        required
      >

      <label for="password">비밀번호</label>
      <input
        type="password"
        id="password"
        placeholder="비밀번호"
        autocomplete="current-password"
        required
      >

      <button type="submit">로그인</button>

    </form>

    <a href="../" class="back-link">
      ← PAGE:HITG 메인으로 돌아가기
    </a>

  </div>

  <script>
    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();
        alert("다음 단계에서 Firebase 로그인을 연결할 예정입니다.");
      });
  </script>

</body>
</html>
