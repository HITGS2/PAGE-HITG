
name: Sync HITGS YouTube Videos

on:
  schedule:
    # 한국 시간 오전 9시 / 오후 9시
    - cron: '0 0,12 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/sync_youtube.py

      - name: Save updated videos
        run: |
          if git diff --quiet -- videos.js; then
            echo "No new videos"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos.js
          git commit -m "Auto update HITGS videos"
          git push
